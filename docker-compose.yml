services:
  twitchdropsbots302:
    container_name: TwitchDropsBotS302
    image: twitchdropsbots302
    network_mode: "bridge"
    ports:
      - "8082:80"
      - "4434:443"
    volumes:
      - ./config/config.json:/init/Configuration/config.json
      - ./config/S302_rules.ini:/S302/S302_rules.ini
      - ./config/S302.ini:/S302/S302.ini
    environment:
      - ADD_ACCOUNT=false
      - INSIDE_DOCKER=true
      - START_DELAY=15
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      "twitch.tv": "127.0.0.1"
      "www.twitch.tv": "127.0.0.1"
